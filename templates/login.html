<!DOCTYPE html>
<html lang="{{ lang|default('fr') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zytholo - Connexion</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body class="login-page" data-i18n-title="page_login_title" data-force-browser-language="true">
    <div class="login-bg" aria-hidden="true">
        <svg class="login-bg-art" viewBox="0 0 500 320" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
            <defs>
                <linearGradient id="loginBarGradient" x1="0" y1="0" x2="0" y2="1">
                    <stop class="login-bar-stop-top" offset="0"/>
                    <stop class="login-bar-stop-bottom" offset="1"/>
                </linearGradient>
            </defs>
            <g class="login-bg-bars" fill="url(#loginBarGradient)">
                <rect x="120" y="200" width="66" height="80" rx="10"/>
                <rect x="200" y="160" width="66" height="120" rx="10"/>
                <rect x="280" y="115" width="66" height="165" rx="10"/>
                <rect x="360" y="65" width="66" height="215" rx="10"/>
            </g>
            <polyline class="login-bg-line" points="60,258 150,238 250,206 350,150 440,100"/>
            <g class="login-bg-nodes">
                <circle cx="60" cy="258" r="7"/>
                <circle cx="150" cy="238" r="7"/>
                <circle cx="250" cy="206" r="7"/>
                <circle cx="350" cy="150" r="7"/>
                <circle cx="440" cy="100" r="7"/>
            </g>
        </svg>
    </div>
    <div class="login-container">
        <div class="login-box">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Zytholo" class="login-logo">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label for="username" data-i18n="login_username">Pseudo</label>
                    <input type="text" id="username" name="username" required>
                </div>
                
                <div class="form-group">
                    <label for="password" data-i18n="login_password">Mot de passe</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                {% if error %}
                    <div class="error">{{ error }}</div>
                {% endif %}
                
                <button type="submit" class="btn-primary" data-i18n="login_button">Connexion</button>
            </form>
        </div>
    </div>
     <div class="bottom-message">
        <p><a href="https://github.com/pstraebler/zytholo">Zytholo</a> v4.0.2 - Developed with 🍺 by <a href="https://pierre.straebler.fr">Pierre Straebler</a></p>
     </div>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
</body>
</html>
